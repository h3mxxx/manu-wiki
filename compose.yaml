name: ${COMPOSE_PROJECT_NAME:-manu-wiki-poc}
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16.15-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: xwiki
      POSTGRES_USER: xwiki
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U xwiki -d xwiki']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  xwiki:
    image: ${XWIKI_IMAGE:-xwiki:17.10.15-postgres-tomcat}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: xwiki
      DB_USER: xwiki
      DB_PASSWORD_FILE: /run/secrets/db_password
      JAVA_OPTS: -Xms512m -Xmx2048m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
    secrets:
      - db_password
    ports:
      - '${XWIKI_BIND_ADDRESS:-127.0.0.1}:${XWIKI_PORT:-8080}:8080'
    volumes:
      - xwiki_data:/usr/local/xwiki
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '10', http://localhost:8080/bin/view/Main/]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
secrets:
  db_password:
    file: ./.secrets/db_password
volumes:
  postgres_data:
  xwiki_data:
